name: Discover Skills

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5         
      - uses: actions/setup-python@v6   
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m skill_harvester discover
      - run: python -m skill_harvester generate-report

name: Discover Skills

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-skills
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Discover and report
        env:
          # Recommended: create the repository secret GH_SEARCH_TOKEN.
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}
          # Fallback token. The package automatically uses it when GH_SEARCH_TOKEN is empty.
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m skill_harvester --config config/config.yml run

      - name: Commit updated catalog and reports
        shell: bash
        run: |
          if git diff --quiet -- data reports; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "chore: update skill catalog [skip ci]"
          git push
